name = "ai-food-care-gemini-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# GEMINI_API_KEY는 여기(파일)에 적지 않고, 아래 명령으로 Secret으로 등록합니다:
#   wrangler secret put GEMINI_API_KEY
#
# 선택 사항: 이 Worker를 특정 도메인(예: GitHub Pages 주소)에서만 호출 가능하게 제한하려면
# 아래 vars에 ALLOWED_ORIGIN을 설정하세요. (설정하지 않으면 모든 origin에서 호출 가능)
#
# [vars]
ALLOWED_ORIGIN = "https://yanickkk.github.io"
